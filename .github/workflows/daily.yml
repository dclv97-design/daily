name: daily-analysis

on:
  # 자동 예약 실행은 끔(GitHub 예약 시간이 들쭉날쭉해서). 앱 각 메뉴의 업데이트 버튼으로만 실행합니다.
  # 다시 켜려면: schedule: [{ cron: "50 21 * * 0-4" }]  (06:50 KST 평일)
  workflow_dispatch:
    inputs:
      part:
        description: "업데이트할 부분"
        required: false
        default: all
        type: choice
        options: [all, stocks, news, flights]

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: engine
        run: npm install --no-audit --no-fund

      - name: Analyze
        working-directory: engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          PART: ${{ inputs.part || 'all' }}
        run: node analyze.mjs

      - name: Publish encrypted data
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "data: $(date -u +%Y-%m-%d) ${{ inputs.part || 'all' }}" || echo "no changes"
          git push
